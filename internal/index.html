<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>旋賞內部</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316213a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23fff' font-family='serif'%3E旋%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#16213a; --ink-2:#3a4560; --mute:#6b7280; --line:#e6e1d8; --paper:#fbf9f5; --tint:#f3efe7;
  --amber:#d97b12; --amber-d:#b8650a; --white:#fff; --red:#b23a3a;
  --sans:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8ebef; --ink-2:#c3c9d3; --mute:#8a929e; --line:#2c333e; --paper:#12161d; --tint:#1a1f28;
    --amber:#f0a04b; --amber-d:#f7b86e; --white:#1e242e; --red:#e07a7a;
  }
}
:root[data-theme="dark"]{
  --ink:#e8ebef; --ink-2:#c3c9d3; --mute:#8a929e; --line:#2c333e; --paper:#12161d; --tint:#1a1f28;
  --amber:#f0a04b; --amber-d:#f7b86e; --white:#1e242e; --red:#e07a7a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;display:flex;flex-direction:column}
[hidden]{display:none!important}

/* gate */
#gate{flex:1;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:360px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.mark{width:52px;height:52px;border-radius:13px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:28px;margin:0 auto 14px}
.box h1{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.box p{margin:0 0 18px;color:var(--mute);font-size:14px}
.pin{width:100%;font-size:28px;letter-spacing:.5em;text-align:center;padding:10px 0 10px .5em;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);font-family:var(--sans);outline:none}
.pin:focus{border-color:var(--amber)}
.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:var(--amber);color:#fff;font-size:16px;font-weight:700;font-family:var(--sans);cursor:pointer}
.btn:disabled{opacity:.6}
.remember{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:14px;color:var(--ink-2)}
.remember input{accent-color:var(--amber)}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.back{display:block;margin-top:14px;font-size:13px;color:var(--mute);text-decoration:none}

/* app */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;overflow-x:auto;flex-shrink:0;align-items:center;gap:6px;padding:0 12px;height:52px;border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;margin-right:8px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--serif);font-size:16px}
.tab{white-space:nowrap;flex-shrink:0;padding:6px 14px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.lock{white-space:nowrap;flex-shrink:0;margin-left:auto;font-size:13px;color:var(--mute);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--sans)}
#asset-status{margin:0;padding:10px 18px;font-size:13px;color:var(--ink-2);background:var(--tint);border-bottom:1px solid var(--line)}
iframe{flex:1;width:100%;border:0;background:var(--paper)}
@media (max-width:420px){.brand span.t{display:none}.tab{white-space:nowrap;flex-shrink:0;padding:6px 11px}}
</style>
</head>
<body>

<div id="gate">
  <form class="box" id="form" autocomplete="off">
    <div class="mark">旋</div>
    <h1>旋賞內部</h1>
    <p>作品展示・交付資料・公司文件</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="••••" aria-label="密碼" autofocus>
    <button class="btn" id="go" type="submit">開啟</button>
    <label class="remember"><input type="checkbox" id="remember" checked>這台裝置記住</label>
    <div class="err" id="err"></div>
    <a class="back" href="../">← 回官網</a>
  </form>
</div>

<div id="app" hidden>
  <div class="bar" role="tablist" id="bar">
    <a class="brand" href="../"><span class="brand-mark">旋</span><span class="t">旋賞數位</span></a>
    <button class="lock" id="lock" type="button">鎖定</button>
  </div>
  <p id="asset-status" role="status" aria-live="polite" hidden></p>
  <iframe id="view" title="內容"></iframe>
</div>

const KEYSTORE = 'spinprize-internal-key';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const te = new TextEncoder(), td = new TextDecoder();

async function deriveKey(pin) {
  const base = await crypto.subtle.importKey('raw', te.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(SALT), iterations: ITER }, base, 256);
}
async function decryptBytes(rawKey, buffer) {
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const buf = new Uint8Array(buffer);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0,12) }, key, buf.slice(12));
}
async function decrypt(rawKey, data) { return td.decode(await decryptBytes(rawKey, b64(data))); }
let pages = null, activeKey = null, viewRevision = 0;
const aliases = {
  benchmark: { page: 'market-research', chapter: 'international' },
  twshare: { page: 'market-research', chapter: 'taiwan' },
  'agency-benchmark': { page: 'market-research', chapter: 'international' },
  'tw-market-share': { page: 'market-research', chapter: 'taiwan' },
  pricing: { page: 'pricing-sales', chapter: 'pricing' },
  script: { page: 'pricing-sales', chapter: 'script' },
  'pricing-war': { page: 'pricing-sales', chapter: 'pricing' },
  'call-script': { page: 'pricing-sales', chapter: 'script' }
};
const allowedAssets = { workbench: 'open', 'seven-product-case': 'download', 'workbench-package': 'download' };
const owns = (obj, id) => Object.prototype.hasOwnProperty.call(obj, id);
async function unlock(rawKey, remember) {
  const out = {};
  for (const t of TABS) out[t.id] = await decrypt(rawKey, t.data);
  pages = out;
  activeKey = rawKey;
  try {
    const hex = [...new Uint8Array(rawKey)].map(b=>b.toString(16).padStart(2,'0')).join('');
    (remember ? localStorage : sessionStorage).setItem(KEYSTORE, hex);
  } catch (e) {}
  $('gate').hidden = true;
  $('app').hidden = false;
  if (location.hash === '#workbench') { show('delivery'); await loadAsset('workbench','open'); }
  else show(location.hash.slice(1) || TABS[0].id);
}
function selectNav(section) {
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.id === section));
}
function show(id) {
  if (!pages) return;
  const alias = owns(aliases,id) ? aliases[id] : null;
  let pageId = alias ? alias.page : id;
  if (!owns(pages,pageId)) { id = TABS[0].id; pageId = id; }
  viewRevision++;
  $('asset-status').hidden = true;
  const tab = TABS.find(t => t.id === pageId);
  let html = pages[pageId];
  if (pageId === 'market-research') html = html.replace('__MARKET_SECTION__', alias?.chapter || 'international');
  if (pageId === 'pricing-sales') html = html.replace('__SALES_SECTION__', alias?.chapter || 'pricing');
  $('view').title = tab.label;
  $('view').srcdoc = html;
  selectNav(tab.section || pageId);
  history.replaceState(null, '', '#' + id);
}
async function loadAsset(id, action) {
  if (!activeKey || !owns(allowedAssets,id) || allowedAssets[id] !== action || !owns(ASSETS,id)) return;
  const asset = ASSETS[id];
  if (asset.action !== action) return;
  const revision = ++viewRevision;
  const status = $('asset-status');
  status.hidden = false;
  status.textContent = action === 'open' ? '正在開啟工作台…' : '正在準備下載檔案…';
  try {
    const response = await fetch(asset.url);
    if (!response.ok) throw new Error('asset unavailable');
    const bytes = await decryptBytes(activeKey, await response.arrayBuffer());
    if (revision !== viewRevision || !activeKey) return;
    if (action === 'open') {
      $('view').title = '商品上架工作台';
      $('view').srcdoc = td.decode(bytes);
      selectNav('delivery');
      history.replaceState(null, '', '#workbench');
      status.hidden = true;
    } else {
      const url = URL.createObjectURL(new Blob([bytes], { type: asset.mime }));
      const a = document.createElement('a');
      a.href = url; a.download = asset.filename; a.hidden = true;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      status.textContent = '已準備好下載：' + asset.filename;
    }
  } catch (error) {
    if (revision !== viewRevision) return;
    status.textContent = '檔案暫時無法開啟，請重新整理並解鎖後再試。';
  }
}
window.addEventListener('message', event => {
  if (event.source !== $('view').contentWindow || !pages || !event.data || typeof event.data !== 'object') return;
  const message = event.data;
  if (message.type === 'spinprize-page' && typeof message.id === 'string' && (owns(pages,message.id) || owns(aliases,message.id))) show(message.id);
  if (message.type === 'spinprize-asset') loadAsset(message.id, message.action);
});
window.addEventListener('hashchange', () => {
  if (!pages) return;
  const id = location.hash.slice(1);
  if (id === 'workbench') loadAsset('workbench','open');
  else show(id);
});
const bar = $('bar'), lock = $('lock');
for (const t of TABS.filter(t => t.nav)) {
  const b = document.createElement('button');
  b.className='tab'; b.type='button'; b.role='tab'; b.dataset.id=t.id; b.textContent=t.label;
  b.onclick=()=>show(t.id);
  bar.insertBefore(b, lock);
}
lock.onclick = () => {
  activeKey = null; pages = null; viewRevision++;
  $('view').srcdoc = '';
  try { localStorage.removeItem(KEYSTORE); sessionStorage.removeItem(KEYSTORE); } catch (e) {}
  location.hash=''; location.reload();
};
$('form').onsubmit = async e => {
  e.preventDefault();
  const pin = $('pin').value.trim(); if (!pin) return;
  $('go').disabled = true; $('err').textContent = '';
  try {
    await unlock(await deriveKey(pin), $('remember').checked);
  } catch (err) {
    $('err').textContent = '密碼不對'; $('pin').value = ''; $('pin').focus();
  }
  $('go').disabled = false;
};

// 記住的裝置：直接開
(async () => {
  let hex = null;
  try { hex = localStorage.getItem(KEYSTORE) || sessionStorage.getItem(KEYSTORE); } catch (e) {}
  if (!hex) return;
  try {
    const raw = Uint8Array.from(hex.match(/../g), h => parseInt(h, 16)).buffer;
    await unlock(raw, true);
  } catch (e) { try { localStorage.removeItem(KEYSTORE); } catch (_) {} }
})();
